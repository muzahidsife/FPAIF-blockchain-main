---
test:
  name: FPAIF AgentIdentityContract Benchmark
  description: On-chain performance of agent registration, lookup, revocation and audit anchoring
  workers:
    number: 2
  rounds:
    - label: registerAgent-10tps
      description: Register new agent identities at 10 TPS
      txNumber: 100
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: benchmarks/workload/registerAgent.js }

    - label: registerAgent-25tps
      txNumber: 250
      rateControl: { type: fixed-rate, opts: { tps: 25 } }
      workload: { module: benchmarks/workload/registerAgent.js }

    - label: registerAgent-50tps
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: benchmarks/workload/registerAgent.js }

    - label: getAgent-query
      description: Read an agent record (authentication lookup)
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: benchmarks/workload/getAgent.js, arguments: { agents: 20 } }

    - label: isRevoked-query
      description: Revocation check performed on every /authenticate
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: benchmarks/workload/isRevoked.js, arguments: { agents: 20 } }

    - label: revokeAgent-10tps
      txNumber: 100
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: benchmarks/workload/revokeAgent.js, arguments: { agents: 50 } }

    - label: anchorAuditBatch-10tps
      description: Anchor audit-log batch root hashes on chain
      txNumber: 100
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: benchmarks/workload/anchorAuditBatch.js }

monitors:
  resource:
    - module: docker
      options:
        interval: 2
        containers:
          - peer0.org1.example.com
          - peer0.org2.example.com
          - orderer.example.com
